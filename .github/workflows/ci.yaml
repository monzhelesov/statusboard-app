name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: cr.yandex/crpufe9dqcko3m9fa2eh

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd api
          pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_SA_KEY }}' | base64 -d > key.json
          cat key.json | docker login --username json_key --password-stdin cr.yandex
          rm key.json

      - name: Build API image
        run: docker build -t $REGISTRY/statusboard-api:${{ github.sha }} -t $REGISTRY/statusboard-api:latest ./api

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/statusboard-api:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Push API image
        run: |
          docker push $REGISTRY/statusboard-api:${{ github.sha }}
          docker push $REGISTRY/statusboard-api:latest

      - name: Build Frontend image
        run: docker build -t $REGISTRY/statusboard-frontend:${{ github.sha }} -t $REGISTRY/statusboard-frontend:latest ./frontend

      - name: Scan Frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/statusboard-frontend:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Push Frontend image
        run: |
          docker push $REGISTRY/statusboard-frontend:${{ github.sha }}
          docker push $REGISTRY/statusboard-frontend:latest
