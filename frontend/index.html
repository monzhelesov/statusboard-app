<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatusBoard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 40px 20px; }
        h1 { text-align: center; font-size: 2rem; margin-bottom: 8px; color: #f8fafc; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-name { font-size: 1.1rem; font-weight: 600; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .operational { background: #064e3b; color: #34d399; }
        .degraded { background: #451a03; color: #fb923c; }
        .down { background: #450a0a; color: #f87171; }
        .uptime { color: #94a3b8; font-size: 0.9rem; }
        .updated { text-align: center; color: #475569; font-size: 0.85rem; margin-top: 40px; }
        .error { text-align: center; color: #f87171; margin-top: 40px; }
    </style>
</head>
<body>
    <h1>StatusBoard</h1>
    <p class="subtitle">Service Status Dashboard</p>
    <div class="grid" id="services"></div>
    <p class="updated" id="updated"></p>
    <p class="error" id="error"></p>

    <script>
        async function fetchServices() {
            try {
                const res = await fetch('/api/services');
                const data = await res.json();
                const grid = document.getElementById('services');
                grid.innerHTML = data.services.map(s => `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-name">${s.name}</span>
                            <span class="badge ${s.status}">${s.status}</span>
                        </div>
                        <div class="uptime">Uptime: ${s.uptime}</div>
                    </div>
                `).join('');
                document.getElementById('updated').textContent = 'Last updated: ' + new Date(data.checked_at).toLocaleString();
            } catch (e) {
                document.getElementById('error').textContent = 'Failed to load services. Retrying...';
            }
        }

        fetchServices();
        setInterval(fetchServices, 30000);
    </script>
</body>
</html>
